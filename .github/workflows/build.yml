name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # Release build of the F65 images. The gate: they must be byte for byte the
  # images in firmware/ (the README's build steps, run by the CI), and every
  # image passes the interrupt-table / overlay check. The built files get a
  # build-provenance attestation.
  release-images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: smk
        skipPush: true
    - name: Setup
      run: nix develop --command meson setup build-release --buildtype=release
    - name: Build
      run: nix develop --command meson compile -C build-release aula-f65-v1_ansi_smk.hex aula-f65-v1_usjis_smk.hex aula-f65-v1_leddiag_smk.hex
    - name: The images in firmware/ are what this source builds
      run: cd build-release && shasum -a 256 --ignore-missing -c ../firmware/aula-f65-v1/SHA256SUMS
    - name: Archive firmware
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: aula-f65-v1-release
        path: build-release/aula-f65-v1_*_smk.hex
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: build-release/aula-f65-v1_*_smk.hex

  # Everything smk builds, debug and release, both NKRO settings (upstream's matrix).
  build:
    strategy:
      matrix:
        nkro: [enabled, disabled]
        buildtype: [debug, release]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: smk
        skipPush: true
    - name: Setup
      run: nix develop --command meson setup build -Dnkro=${{ matrix.nkro }} -Dbuildtype=${{ matrix.buildtype }}
    - name: Build
      run: nix develop --command meson compile -C build
    - name: Build library examples
      run: nix develop --command meson compile -C build examples

  # The simulator tests, one job per file (the long ones take 10-20 minutes).
  # The checks that need the vendor's stock image skip here.
  sim-tests:
    strategy:
      fail-fast: false
      matrix:
        test: [test_usb, test_boot, test_stack, test_source_breakpoints,
               test_air75, test_air75_usjis,
               test_f65, test_f65_usjis, test_f65_fnrow, test_f65_led, test_f65_indicators, test_f65_radio, test_f65_backlight]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: smk
        skipPush: true
    - name: Setup
      run: nix develop --command meson setup build
    - name: Build firmware
      run: nix develop --command meson compile -C build
    - name: Run ${{ matrix.test }}
      run: |
        nix develop --command bash -c '
          export SMK_UCSIM=$(command -v ucsim-sh68f90)
          cd tests && python3 -m unittest -v ${{ matrix.test }}'

  smk-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/smk-console
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1 (stable)
      with:
        toolchain: stable
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        workspaces: tools/smk-console
    - name: Format
      run: cargo fmt --check
    - name: Lint
      run: cargo clippy --all-targets -- -D warnings
    - name: Build
      run: cargo build --release

  format-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: smk
        skipPush: true
    - name: Setup
      run: nix develop --command meson setup build
    - name: Lint
      run: nix develop --command ninja -C build clang-format-check
    - name: Lint meson
      run: nix develop --command meson format -c meson.format --check-only --recursive src meson.build meson.options
