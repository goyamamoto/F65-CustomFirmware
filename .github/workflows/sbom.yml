name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  # A software bill of materials of this tree (SPDX): the Rust crates of
  # tools/smk-console (Cargo.lock) and the Nix inputs (flake.lock). The
  # firmware itself has no dependencies beyond this tree, SDCC and smk.
  # On a release the SBOM is attached to it; on every push it is an artifact
  # and its Cargo dependencies are submitted to the dependency graph.
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # release assets and the dependency-graph submission
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      with:
        path: .
        format: spdx-json
        artifact-name: F65-CustomFirmware.spdx.json
        output-file: F65-CustomFirmware.spdx.json
        dependency-snapshot: true
        upload-artifact: true
        upload-release-assets: true
